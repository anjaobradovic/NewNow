services:
  # Elasticsearch (single-node)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.4
    container_name: newnow-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.name: newnow-cluster
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - newnow-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  # MinIO (single-node S3-compatible object storage)
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: newnow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - newnow-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: newnow-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: newnow
      MYSQL_USER: newnow_user
      MYSQL_PASSWORD: newnow_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - newnow-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_password",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: newnow-backend
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/newnow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: newnow_user
      SPRING_DATASOURCE_PASSWORD: newnow_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      NEWNOW_MINIO_URL: http://minio:9000
      NEWNOW_MINIO_PUBLIC_URL: http://localhost:9000
      NEWNOW_MINIO_ACCESS_KEY: minioadmin
      NEWNOW_MINIO_SECRET_KEY: minioadmin
      NEWNOW_MINIO_BUCKET: newnow
      SEARCH_BOOTSTRAP_ON_STARTUP: "true"
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - newnow-network
    volumes:
      - ./backend/logs:/app/logs

  # Angular Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: newnow-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - newnow-network
    environment:
      API_URL: http://localhost:8080/api

volumes:
  mysql_data:
    driver: local
  es_data:
    driver: local
  minio_data:
    driver: local

networks:
  newnow-network:
    driver: bridge
