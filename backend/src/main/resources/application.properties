spring.application.name=NewNow

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/newnow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:newnow_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:newnow_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
# Options: update, create, create-drop, validate, none
# create-drop = drops and recreates tables on startup/shutdown (dev only)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.hbm2ddl.drop_ordering=true

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET:YourVerySecretKeyThatShouldBeAtLeast256BitsLongForHS256Algorithm}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Email Configuration (Gmail example)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Seeded admin credentials (DataLoader)
newnow.admin.primary.email=${ADMIN_PRIMARY_EMAIL:anja.obradovic@newnow.com}
newnow.admin.primary.password=${ADMIN_PRIMARY_PASSWORD:admin123}
newnow.admin.secondary.email=${ADMIN_SECONDARY_EMAIL:marko.gordic@newnow.com}
newnow.admin.secondary.password=${ADMIN_SECONDARY_PASSWORD:admin123}

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.rs.ftn.newnow=DEBUG

# File Upload Configuration
file.upload.dir=uploads/avatars
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB

# Application Version Information
app.version=0.0.1-SNAPSHOT
app.commit=unknown
app.build-time=unknown
